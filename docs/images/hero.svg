<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">Week weeks — Your week. No distractions.</title>
  <desc id="desc">An ad-free, offline Android timetable with no account required. A soft pastel weekly grid illustrates a calm, uncluttered week.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7F8FD"/><stop offset="1" stop-color="#EAEFFA"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#344E79"/><stop offset="1" stop-color="#253754"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="17" flood-color="#253754" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1440" height="520" rx="32" fill="url(#bg)"/>
  <circle cx="1400" cy="15" r="215" fill="#F9E5DE" opacity="0.65"/>
  <circle cx="75" cy="530" r="160" fill="#DFE8F6"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="86" y="76" width="144" height="32" rx="16" fill="#F6DFD8"/>
    <text x="158" y="98" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.5" fill="#9B5247">LESS NOISE</text>
    <text x="84" y="208" font-size="82" font-weight="700" letter-spacing="-3" fill="#263B5C">Week weeks</text>
    <text x="89" y="270" font-size="30" fill="#52617A">Your week. No distractions.</text>
    <text x="89" y="316" font-size="19" fill="#66758D">A calm space for classes and everyday plans.</text>
    <g font-size="15" font-weight="700" letter-spacing="0.8" fill="#3C506C">
      <rect x="88" y="365" width="115" height="42" rx="21" fill="#FFFFFF"/><text x="145" y="392" text-anchor="middle">NO ADS</text>
      <rect x="215" y="365" width="120" height="42" rx="21" fill="#FFFFFF"/><text x="275" y="392" text-anchor="middle">OFFLINE</text>
      <rect x="347" y="365" width="167" height="42" rx="21" fill="#FFFFFF"/><text x="430" y="392" text-anchor="middle">NO ACCOUNT</text>
    </g>
  </g>
  <g transform="translate(810 58)" filter="url(#shadow)">
    <rect width="528" height="404" rx="28" fill="#FFFFFF"/>
    <rect x="24" y="24" width="480" height="93" rx="17" fill="url(#blue)"/>
    <g font-family="Arial, Helvetica, sans-serif" fill="#FFFFFF"><text x="43" y="55" font-size="13" letter-spacing="1.5" opacity="0.7">MAKE ROOM FOR YOUR WEEK</text><text x="42" y="91" font-size="25" font-weight="700">Classes. Plans. Peace of mind.</text></g>
    <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="11" font-weight="700" fill="#758199"><text x="72" y="147">MON</text><text x="168" y="147">TUE</text><text x="264" y="147">WED</text><text x="360" y="147">THU</text><text x="456" y="147">FRI</text></g>
    <g stroke="#EDF0F7" stroke-width="1"><path d="M24 165H504M24 231H504M24 297H504M24 363H504M120 162V376M216 162V376M312 162V376M408 162V376"/></g>
    <rect x="32" y="169" width="80" height="112" rx="10" fill="#D7E5F5"/>
    <rect x="128" y="235" width="80" height="112" rx="10" fill="#DCEBD7"/>
    <rect x="224" y="169" width="80" height="50" rx="10" fill="#F3E3C6"/>
    <rect x="224" y="301" width="80" height="46" rx="10" fill="#E4DDF2"/>
    <rect x="320" y="169" width="80" height="112" rx="10" fill="#F1DCD8"/>
    <rect x="416" y="235" width="80" height="50" rx="10" fill="#D8EAE6"/>
    <g fill="#7589A3" opacity="0.45"><rect x="44" y="186" width="52" height="5" rx="2.5"/><rect x="44" y="201" width="36" height="4" rx="2"/><rect x="140" y="252" width="48" height="5" rx="2.5"/><rect x="140" y="267" width="33" height="4" rx="2"/><rect x="236" y="186" width="50" height="5" rx="2.5"/><rect x="332" y="186" width="48" height="5" rx="2.5"/><rect x="332" y="201" width="35" height="4" rx="2"/><rect x="428" y="252" width="48" height="5" rx="2.5"/></g>
