plugins {
    id "com.android.application"
}

// Release signing credentials are resolved in this order:
//   1. Environment variables (preferred for CI):
//      WEEK_WEEKS_STORE_FILE, WEEK_WEEKS_STORE_PASSWORD, WEEK_WEEKS_KEY_ALIAS, WEEK_WEEKS_KEY_PASSWORD
//   2. secrets/release-signing.properties in the project (git-ignored; see the .template)
//   3. ~/.gradle/week-weeks-signing.properties (user home, outside the repo)
// When nothing resolves, the release build stays unsigned so that a fresh clone can
// still run assembleRelease (it produces app-release-unsigned.apk).
def signingProps = new Properties()
[
    rootProject.file("secrets/release-signing.properties"),
    new File(System.getProperty("user.home"), ".gradle/week-weeks-signing.properties")
].each { File candidate ->
    if (candidate.exists()) {
        candidate.withInputStream { signingProps.load(it) }
    }
}

def signingValue = { String envName, String propName ->
    def envValue = System.getenv(envName)
    if (envValue != null && !envValue.isEmpty()) {
        return envValue
    }
    return signingProps.getProperty(propName)
}

def releaseStoreFile = signingValue("WEEK_WEEKS_STORE_FILE", "storeFile")
def releaseStorePassword = signingValue("WEEK_WEEKS_STORE_PASSWORD", "storePassword")
def releaseKeyAlias = signingValue("WEEK_WEEKS_KEY_ALIAS", "keyAlias")
def releaseKeyPassword = signingValue("WEEK_WEEKS_KEY_PASSWORD", "keyPassword")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
if (!hasReleaseSigning) {
    logger.lifecycle("No release signing credentials resolved: assembleRelease will emit an unsigned APK.")
}

android {
    namespace "com.weekweeks.app"
    compileSdk {
        version = release(36) {
            it.minorApiLevel = 1
        }
    }
    buildToolsVersion "36.1.0"

    defaultConfig {
        applicationId "com.weekweeks.app"
        minSdk 23
        targetSdk 36
        versionCode 9
        versionName "1.2.6"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    // The in-app language switch picks any of the bundled languages at runtime. Language
    // splits would let Play deliver only the device language, so package all of them.
    bundle {
        language {
            enableSplit = false
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "ENABLE_TEST_COURSE", "true"
            buildConfigField "boolean", "PASTEL_UI", "true"
        }
        pastel {
            initWith release
            applicationIdSuffix ".pastel"
            versionNameSuffix "-pastel"
            signingConfig signingConfigs.debug
            matchingFallbacks = ["release"]
            buildConfigField "boolean", "ENABLE_TEST_COURSE", "false"
            buildConfigField "boolean", "PASTEL_UI", "true"
            resValue "string", "app_name", "Week weeks"
        }
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            buildConfigField "boolean", "ENABLE_TEST_COURSE", "false"
            buildConfigField "boolean", "PASTEL_UI", "true"
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation "com.google.android.material:material:1.12.0"
    testImplementation "junit:junit:4.13.2"
}
